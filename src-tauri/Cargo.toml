[package]
name = "crypt"
version = "0.3.0"
description = "Aplicativo desktop do Crypt para Windows"
authors = ["Kaio Snow"]
license = "Proprietary"
repository = "https://github.com/KakaSnowww/crypt"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "crypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5" }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2.3.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.3.7", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = { version = "0.9.7", default-features = false }
