name: Publicar aplicativo Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Validar e publicar NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validar configuração de produção
        shell: pwsh
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: |
          $requiredVariables = @(
            "VITE_SUPABASE_URL",
            "VITE_SUPABASE_PUBLISHABLE_KEY",
            "VITE_LIVEKIT_URL"
          )

          foreach ($variable in $requiredVariables) {
            $value = [Environment]::GetEnvironmentVariable($variable)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Configure o secret $variable em Settings > Secrets and variables > Actions."
            }
          }

          if ($env:DISCORD_APPLICATION_ID -notmatch '^\d{17,20}$') {
            throw "Configure a variable DISCORD_APPLICATION_ID em Settings > Secrets and variables > Actions > Variables."
          }

          $configPath = "electron/discordConfig.ts"
          $config = Get-Content $configPath -Raw
          $config = $config.Replace("__CRYPT_DISCORD_APPLICATION_ID__", $env:DISCORD_APPLICATION_ID)
          $resolvedConfigPath = (Resolve-Path $configPath).Path
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($resolvedConfigPath, $config, $utf8WithoutBom)

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Formatar configuração gerada
        run: npx prettier --write electron/discordConfig.ts

      - name: Validar frontend e Electron
        run: npm run validate:desktop

      - name: Conferir versão da tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "A tag deve ser v$packageVersion, mas foi ${{ github.ref_name }}."
          }

      - name: Criar instalador e metadados de atualização
        run: npm run desktop:build

      - name: Publicar e verificar arquivos da Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $repository = $env:GITHUB_REPOSITORY
          $assets = @(
            "release/Crypt-Setup-$version.exe",
            "release/Crypt-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "O build não gerou o arquivo obrigatório: $asset"
            }
          }

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repository --title "Crypt $tag" --generate-notes
          }

          $PSNativeCommandUseErrorActionPreference = $true
          gh release upload $tag @assets --repo $repository --clobber

          $publishedNames = @(
            gh release view $tag --repo $repository --json assets --jq '.assets[].name'
          )

          foreach ($asset in $assets) {
            $assetName = Split-Path $asset -Leaf
            if ($publishedNames -notcontains $assetName) {
              throw "A Release não contém o arquivo obrigatório: $assetName"
            }
          }
