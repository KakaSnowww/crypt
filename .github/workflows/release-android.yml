name: Publicar aplicativo Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    name: Validar e publicar APK e AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRYPT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CRYPT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CRYPT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validar segredos de produção
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          required=(
            ANDROID_GOOGLE_SERVICES_JSON_BASE64
            ANDROID_KEYSTORE_BASE64
            CRYPT_ANDROID_KEYSTORE_PASSWORD
            CRYPT_ANDROID_KEY_ALIAS
            CRYPT_ANDROID_KEY_PASSWORD
            VITE_SUPABASE_URL
            VITE_SUPABASE_PUBLISHABLE_KEY
            VITE_LIVEKIT_URL
          )

          for variable in "${required[@]}"; do
            if [ -z "${!variable:-}" ]; then
              echo "Configure o secret $variable em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/crypt-release.keystore
          echo "CRYPT_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/crypt-release.keystore" >> "$GITHUB_ENV"

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Conferir configuração do Firebase Android
        run: npm run android:push:check

      - name: Validar frontend
        run: npm run validate

      - name: Sincronizar projeto Android
        run: npm run android:sync

      - name: Conferir versão da tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "A tag deve ser v$packageVersion, mas foi ${{ github.ref_name }}."
          }

      - name: Gerar APK e AAB assinados
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Preparar artefatos da versão
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/app-release.apk "release-android/Crypt-Android-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-android/Crypt-Android-$version.aab"
          sha256sum "release-android/Crypt-Android-$version.apk" > "release-android/Crypt-Android-$version.sha256"

      - name: Publicar e verificar arquivos da Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          repository="$GITHUB_REPOSITORY"
          assets=(
            "release-android/Crypt-Android-$version.apk"
            "release-android/Crypt-Android-$version.aab"
            "release-android/Crypt-Android-$version.sha256"
          )

          if ! gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repository" --title "Crypt $tag" --generate-notes || true
          fi
          gh release view "$tag" --repo "$repository" >/dev/null
          gh release upload "$tag" "${assets[@]}" --repo "$repository" --clobber

          published_names="$(gh release view "$tag" --repo "$repository" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            asset_name="$(basename "$asset")"
            if ! grep -Fxq "$asset_name" <<< "$published_names"; then
              echo "A Release não contém o arquivo obrigatório: $asset_name"
              exit 1
            fi
          done
